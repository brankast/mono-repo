<h1>Create an account</h1>
<form [formGroup]="form" (ngSubmit)="submit($event)">
  <ds-input
    formControlName="email"
    label="Email"
    type="email"
    name="email"
    autocomplete="email"
    required
  ></ds-input>
  <ds-input
    formControlName="password"
    label="Password"
    type="password"
    name="password"
    autocomplete="new-password"
    [attr.minlength]="passwordMinLength"
    required
  ></ds-input>
  <ds-input
    formControlName="confirmPassword"
    label="Confirm password"
    type="password"
    name="confirmPassword"
    autocomplete="new-password"
    #confirmPassword
    [attr.minlength]="passwordMinLength"
    required
    (focusout)="onConfirmBlur()"
  ></ds-input>
  @if (formError) {
    <p class="form-error" role="alert">{{ formError }}</p>
  }
  <ds-button type="submit" [attr.loading]="submitting ? '' : null">Create account</ds-button>
</form>
<p class="switch"><a routerLink="/">Sign in</a></p>
