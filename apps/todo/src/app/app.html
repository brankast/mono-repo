<main class="page">
  <nav aria-label="Todos">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Todos</a>
    <button type="button" class="sign-out" (click)="signOut()" [disabled]="signingOut">Sign out</button>
  </nav>
  @if (signOutError) {
    <p class="form-error" role="alert">{{ signOutError }}</p>
  }
  <router-outlet />
</main>
